name: DAST - OWASP ZAP Full Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: 
      - name: Install lab dependencies
        
        working-directory: idor/backend 
        run: |
          npm install

      # Step 2: 
      - name: Start vulnerable app
        
        working-directory: idor/backend
        run: |
          # CHANGED: If the start command is different, update it here (e.g., node index.js)
          # Assuming the app is still started with 'npm start' based on your prompt,
          # but if it requires 'node index.js', replace 'npm start' accordingly.
          npm start & 
          # Wait for the server to boot up
          sleep 20 

      # Step 3: Run the ZAP scan
      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          # CHANGED: Use the new port (8080) for the target URL
          target: 'http://localhost:8080'
          
          # Keep this as false for now to get a 'Success' status (Task 1/2 requirement)
          fail_action: false
          
          allow_issue_writing: false
