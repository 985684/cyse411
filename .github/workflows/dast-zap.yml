name: DAST - OWASP ZAP Full Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CHANGED: Use the new folder path (e.g., 'canonicalization-example')
      - name: Install lab dependencies
        working-directory: canonicalization-example 
        run: |
          npm install

      # CHANGED: Use the new folder path
      - name: Start vulnerable app
        working-directory: canonicalization-example
        run: |
          # Use 'npm start' or the correct custom start command if necessary
          npm start & 
          # Wait for the server to boot up
          sleep 20 

      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          # CHANGED: Use the new port (8080) for the target URL
          target: 'http://localhost:8080'
          
          # Keeps the job status as Success 
          fail_action: false
          
          allow_issue_writing: false
