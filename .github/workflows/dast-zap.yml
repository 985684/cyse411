name: DAST - OWASP ZAP Full Scan

on:
  workflow_dispatch:
  # push:
  #  branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fix 1: Ensure the working directory is correct based on the 'cyse411' repository structure
      - name: Install lab dependencies
        working-directory: fastbank-auth-lab/backend    # <--- CORRECTED FOLDER NAME
        run: |
          npm install

      - name: Start vulnerable app
        working-directory: fastbank-auth-lab/backend     # <--- CORRECTED FOLDER NAME
        run: |
          # Use `npm start &` to run in the background. Note the server will likely run on localhost:3000
          npm start & 
          # Wait for the server to boot up and be ready for connections
          sleep 20

      # Fix 2: The target must be 'http://localhost'
      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:3000' # <--- CORRECTED TARGET URL
          fail_action: true               
          allow_issue_writing: false
