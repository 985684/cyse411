# Correct file name: .github/workflows/sast-semgrep.yml

name: SAST - Semgrep Scan

# This block defines the events that start the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  semgrep-scan:
    # This specifies the runner environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 # Step 1: Clone the code
      
    - name: Run Semgrep Scan
      # Step 2: Use the Semgrep Action
      uses: returntocorp/semgrep-action@v1 
      with:
        config: |
          p/security-audit
          p/owasp-top-ten
     
